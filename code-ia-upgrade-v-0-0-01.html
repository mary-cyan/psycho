    const estadoXboxJSON = localStorage.getItem(claveLocalStorage);

const claveLocalStorage = "xboxEstado";

function mostrarMensaje(mensaje, tipo = 'info') {
    const mensajeElement = document.getElementById('mensaje');
    mensajeElement.textContent = mensaje;
    mensajeElement.className = tipo; // 'info', 'error', 'success'
}

function guardarEstado() {
    const nombreJuego = document.getElementById("nombreJuego").value;
    const progreso = document.getElementById("progreso").value;
    const dificultad = document.getElementById("dificultad").value;

    const estadoXbox = {
        nombreJuego: nombreJuego,
        progreso: progreso,
        dificultad: dificultad
    };


    try {
        const estadoXboxJSON = JSON.stringify(estadoXbox);
        localStorage.setItem(claveLocalStorage, estadoXboxJSON);
        mostrarMensaje("Estado guardado correctamente.", 'success');
    } catch (error) {
        console.error("Error al guardar el estado:", error);
        mostrarMensaje("Error al guardar el estado.  Verifica la consola.", 'error');
    }
}

function cargarEstado() {
    try {
        const estadoXboxJSON = localStorage.getItem(claveLocalStorage);

        if (estadoXboxJSON === null) {
            mostrarMensaje("No hay estado guardado.");
            return;
        }

        const estadoXbox = JSON.parse(estadoXboxJSON);

        document.getElementById("nombreJuego").value = estadoXbox.nombreJuego;
        document.getElementById("progreso").value = estadoXbox.progreso;
        document.getElementById("dificultad").value = estadoXbox.dificultad;

        mostrarMensaje("Estado cargado correctamente.", 'success');

    } catch (error) {
        console.error("Error al cargar el estado:", error);
        mostrarMensaje("Error al cargar el estado. Verifica la consola.", 'error');
    }
}


window.onload = function() {
    cargarEstado();
};

**Explicación detallada:** * **`claveLocalStorage = "xboxEstado";`**: Esta es la clave con la que guardarás y recuperarás los datos en `localStorage`. Es *crucial* usar una clave única para evitar que tu aplicación interfiera con otras que puedan estar usando `localStorage` en el mismo dominio. Cámbiala si es necesario para que sea específica de tu juego o aplicación. * **`guardarEstado()`**: * **Recolecta los datos:** Obtiene los valores de los campos de entrada (inputs, selects, etc.) en tu formulario HTML. Asegúrate de que los IDs de los elementos en `document.getElementById()//qe t/ñ/u aplicación interfiera con otras que puedan estar usando `localStorage` en el mismo dominio. Cámbiala si es necesario para que sea específica de tu juego o aplicación. * **`guardarEstado()`**: * **Recolecta los datos:** Obtiene los valores de los campos de entrada (inputs, selects, etc.) en tu formulario HTML. Asegúrate de que los IDs de los elementos en `document.getElementById()` coincidan con los IDs en tu HTML. * **Crea un objeto:** Crea un objeto JavaScript (`estadoXbox`) que contiene todos los datos que deseas guardar. La estructura de este objeto depende de la información que necesitas persistir. * **Convierte a JSON:** Usa `JSON.stringify(estadoXbox)` para convertir el objeto JavaScript a una cadena JSON. `localStorage` solo puede almacenar cadenas de texto. * **Guarda en localStorage:** Usa `localStorage.setItem(claveLocalStorage, estadoXboxJSON)` para guardar la cadena JSON en `localStorage`. El primer argumento es la clave (el nombre con el que guardarás los datos) y el segundo es el valor (la cadena JSON). * **Feedback al usuario:** Un `alert()` simple informa al usuario que el estado ha sido guardado. Considera usar algo más sutil (un mensaje en la página, un icono de éxito) para una mejor experiencia de usuario. * **`cargarEstado()`**: * **Obtiene el JSON:** Usa `localStorage.getItem(claveLocalStorage)` para obtener la cadena JSON desde `localStorage` usando la misma clave que usaste para guardar. * **Verifica si existe:** Es *fundamental* verificar si hay algo guardado en `localStorage` antes de intentar cargarlo. `localStorage.getItem()` devuelve `null` si no hay nada guardado con esa clave. Si intentas usar `JSON.parse(null)`, obtendrás un error. * **Convierte de JSON a objeto:** Usa `JSON.parse(estadoXboxJSON)` para convertir la cadena JSON de vuelta a un objeto JavaScript. * **Carga los datos en el formulario:** Asigna los valores del objeto JavaScript a los campos de entrada correspondientes en tu formulario HTML. Asegúrate de que los IDs sean correctos. * **Feedback al usuario:** Informa al usuario que el estado ha sido cargado. * **`window.onload` (carga automática opcional):** * Esta función se ejecuta automáticamente cuando la página web se ha cargado completamente. * Llama a `cargarEstado()` dentro de `window.onload` para intentar cargar el estado guardado cada vez que la página se abre o se recarga. Esto hace que la aplicación recuerde el estado automáticamente sin necesidad de que el usuario presione el botón "Cargar Estado". **Consideraciones y mejoras:** * **Manejo de errores:** Agrega bloques `try...catch` alrededor de `JSON.parse()` y `localStorage.setItem()` para capturar errores que puedan ocurrir (por ejemplo, si el JSON está corrupto o si `localStorage` está lleno). Esto hará que tu aplicación sea más robusta. * **Validación de datos:** Antes de guardar el estado, valida los datos que ingresa el usuario (por ejemplo, asegúrate de que el progreso sea un número entre 0 y 100). Esto evita que se guarden datos incorrectos. * **Experiencia de usuario:** Reemplaza los `alert()` con mensajes más sutiles en la página. Considera usar un sistema de notificaciones o simplemente actualizar el contenido de un elemento HTML existente. * **Estructura de datos:** Si tienes muchos datos que guardar, considera usar una estructura de datos más compleja (por ejemplo, un array de objetos). Asegúrate de que la estructura de datos sea consistente y fácil de manejar. * **Limpieza de localStorage:** `localStorage` tiene un límite de tamaño (generalmente 5MB por dominio). Si guardas muchos datos, podrías alcanzar este límite. Considera limpiar datos antiguos o innecesarios periódicamente. **Ejemplo con manejo de errores y una mejor experiencia de usuario:**
